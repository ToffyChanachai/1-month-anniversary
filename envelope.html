<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Envelope Letter</title>
  <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #ffd6e0;
      --bg2: #ffeef2;
      --env: #e8505b;
      --env-dark: #c93d48;
      --env-light: #f26b74;
      --paper: #fffaf0;
      --ink: #5a3e36;
      --seal: #a8202b;

      /* ความกว้างซอง: ย่อ/ขยายตามจอ ทั้งด้านกว้างและด้านสูง */
      --w: min(86vw, 440px, calc((100vh - 110px) / 1.5));
    }
    @supports (height: 100dvh) {
      :root { --w: min(86vw, 440px, calc((100dvh - 110px) / 1.5)); }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: calc(var(--w) * 0.1);
      padding: 16px;
      background: radial-gradient(circle at 50% 40%, var(--bg2), var(--bg1));
      font-family: 'Itim', cursive;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .hint {
      color: var(--env-dark);
      font-size: clamp(15px, calc(var(--w) * 0.05), 20px);
      text-align: center;
      animation: blink 1.6s ease-in-out infinite;
      transition: opacity .4s;
    }
    .open-state .hint { opacity: 0; }

    @keyframes blink {
      0%, 100% { opacity: .4; }
      50% { opacity: 1; }
    }

    /* ---------- Envelope ---------- */
    .envelope-wrap {
      perspective: 1000px;
      /* เว้นที่ด้านบนไว้ให้จดหมายเลื่อนขึ้นมา */
      padding-top: calc(var(--w) * 0.8);
    }

    .envelope {
      position: relative;
      width: var(--w);
      height: calc(var(--w) * 0.65);
      cursor: pointer;
      animation: float 3s ease-in-out infinite;
      outline: none;
    }
    .envelope.open { animation: none; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }

    .back {
      position: absolute;
      inset: 0;
      background: var(--env-dark);
      border-radius: 6px;
      box-shadow: 0 20px 40px rgba(168, 32, 43, .3);
    }

    /* Letter */
    .letter {
      --line: calc(var(--w) * 0.075);
      position: absolute;
      left: calc(var(--w) * 0.05);
      right: calc(var(--w) * 0.05);
      bottom: calc(var(--w) * 0.025);
      height: calc(var(--w) * 0.6);
      overflow: hidden;
      background: var(--paper);
      border-radius: 4px;
      padding: calc(var(--w) * 0.06) calc(var(--w) * 0.07);
      color: var(--ink);
      z-index: 2;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
      transition: transform .9s cubic-bezier(.22,1,.36,1) .5s, height .6s ease .5s;
      background-image: repeating-linear-gradient(
        transparent 0 calc(var(--line) - 1px), #f1dcc8 calc(var(--line) - 1px) var(--line)
      );
      background-position: 0 calc(var(--w) * 0.135);
    }
    .letter h2 {
      font-size: calc(var(--w) * 0.065);
      line-height: var(--line);
      color: var(--env);
      margin-bottom: calc(var(--w) * 0.015);
    }
    .letter p {
      font-size: calc(var(--w) * 0.047);
      line-height: var(--line);
      opacity: 0;
      transition: opacity .6s ease 1.2s;
    }
    .letter .sign {
      text-align: right;
    }

    .envelope.open .letter {
      transform: translateY(calc(var(--w) * -0.55));
      height: calc(var(--w) * 0.88);
    }
    .envelope.open .letter p { opacity: 1; }

    /* Front pocket (left, right, bottom triangles) */
    .pocket {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }
    .pocket::before,
    .pocket::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 6px;
    }
    .pocket::before {
      background: var(--env-light);
      clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
    }
    .pocket::after {
      background: var(--env);
      clip-path: polygon(0 100%, 50% 48%, 100% 100%);
    }

    /* Top flap */
    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(var(--w) * 0.38);
      background: var(--env);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      z-index: 4;
      transition: transform .6s ease, z-index 0s linear .3s;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.15));
    }
    .envelope.open .flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    /* Wax seal */
    .seal {
      --size: calc(var(--w) * 0.15);
      position: absolute;
      top: calc(var(--w) * 0.38 - var(--size) / 2);
      left: 50%;
      width: var(--size);
      height: var(--size);
      margin-left: calc(var(--size) / -2);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #d33a46, var(--seal));
      box-shadow: 0 3px 6px rgba(0,0,0,.3), inset 0 0 0 4px rgba(255,255,255,.12);
      display: grid;
      place-items: center;
      color: #ffd1d6;
      font-size: calc(var(--size) * 0.5);
      z-index: 5;
      transition: transform .4s ease, opacity .3s ease;
    }
    @media (hover: hover) {
      .envelope:hover .seal { transform: scale(1.1); }
    }
    .envelope:focus-visible .seal { transform: scale(1.1); }
    .envelope.open .seal {
      transform: scale(0) rotate(180deg);
      opacity: 0;
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      bottom: -40px;
      color: var(--env);
      pointer-events: none;
      animation: rise linear forwards;
      z-index: 10;
    }
    @keyframes rise {
      0%   { transform: translateY(0) scale(.6) rotate(0); opacity: 0; }
      10%  { opacity: 1; }
      100% { transform: translateY(-110vh) scale(1.2) rotate(40deg); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .envelope, .hint { animation: none; }
    }
  </style>
</head>
<body>

  <div class="envelope-wrap">
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="เปิดซองจดหมาย">
      <div class="back"></div>
      <div class="letter">
        <h2>ถึง คนพิเศษ 💌</h2>
        <p>ขอบคุณที่อยู่ข้าง ๆ กันเสมอนะ<br>
           ทุกวันที่มีเธอคือวันที่ดีที่สุด<br>
           ขอให้วันนี้เป็นวันที่สดใสของเธอ ✨</p>
        <p class="sign">— จากฉันเอง</p>
      </div>
      <div class="pocket"></div>
      <div class="flap"></div>
      <div class="seal">♥</div>
    </div>
  </div>

  <div class="hint">แตะที่ซองเพื่อเปิดจดหมาย</div>

  <script>
    const envelope = document.getElementById('envelope');

    function toggle() {
      const isOpen = envelope.classList.toggle('open');
      envelope.setAttribute('aria-label', isOpen ? 'ปิดซองจดหมาย' : 'เปิดซองจดหมาย');
      document.body.classList.toggle('open-state', isOpen);
      if (isOpen) setTimeout(burstHearts, 600);
    }

    function burstHearts() {
      const count = window.innerWidth < 600 ? 12 : 20;
      for (let i = 0; i < count; i++) {
        const h = document.createElement('div');
        h.className = 'heart';
        h.textContent = '♥';
        h.style.left = Math.random() * 100 + 'vw';
        h.style.fontSize = 14 + Math.random() * 22 + 'px';
        h.style.animationDuration = 3 + Math.random() * 3 + 's';
        h.style.animationDelay = Math.random() * 1.5 + 's';
        document.body.appendChild(h);
        h.addEventListener('animationend', () => h.remove());
      }
    }

    envelope.addEventListener('click', toggle);
    envelope.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  </script>
</body>
</html>
